<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login to Service with LUS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-4 relative">

  <div id="closeOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex-col items-start p-6">
    <div class="flex items-center gap-3 text-white bg-slate-800/90 border border-slate-700 px-4 py-3 rounded-2xl shadow-2xl animate-bounce">
      <i data-lucide="arrow-up-left" class="w-6 h-6 text-indigo-400"></i>
      <span class="text-xs font-semibold tracking-wide">Press the X button in the top left corner to close</span>
    </div>
    <button onclick="hideCloseOverlay()" class="mt-auto self-center px-6 py-2 bg-white/10 hover:bg-white/20 text-white text-xs font-medium rounded-xl border border-white/20 transition-colors">
      Dismiss
    </button>
  </div>

  <div id="authContainer" class="w-full max-w-sm bg-white border border-slate-200 rounded-2xl shadow-lg p-6 transition-all duration-300">
    
    <div id="oauthStepAuthorize" class="text-center">
      <div class="flex items-center justify-center gap-3 mb-5">
        <div class="w-12 h-12 bg-slate-900 rounded-xl flex items-center justify-center text-white shadow-md">
          <i data-lucide="shapes" class="w-6 h-6 text-indigo-400"></i>
        </div>

        <div class="text-slate-400 flex items-center">
          <i data-lucide="arrow-right" class="w-4 h-4 animate-pulse"></i>
        </div>

        <div class="w-12 h-12 bg-gradient-to-tr from-pink-500 via-red-500 to-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
          <i data-lucide="zap" class="w-6 h-6 fill-white"></i>
        </div>
      </div>

      <h1 id="loginTitle" class="text-lg font-bold text-slate-900 mb-1">Login to Service App</h1>
      <p class="text-xs text-slate-500 mb-6">Connect <span id="serviceAppName" class="font-semibold text-slate-700">Service App</span> with your LUS account.</p>

      <div class="space-y-2 mb-6 text-left text-xs bg-slate-50 p-3.5 rounded-xl border border-slate-100">
        <div class="flex items-center gap-2.5 text-slate-700">
          <i data-lucide="check" class="w-4 h-4 text-emerald-500"></i>
          <span>Profile info</span>
        </div>
        <div class="flex items-center gap-2.5 text-slate-700">
          <i data-lucide="check" class="w-4 h-4 text-emerald-500"></i>
          <span id="userEmail">alex.morgan@lus-service.io</span>
        </div>
      </div>

      <button onclick="processAuthorization()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-xs shadow-md shadow-indigo-600/20 transition-all flex items-center justify-center gap-1.5">
        <i data-lucide="zap" class="w-3.5 h-3.5 fill-white"></i>
        <span>Authorize</span>
      </button>
    </div>

    <div id="oauthStepLoading" class="py-6 text-center hidden">
      <div class="inline-block w-6 h-6 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin mb-3"></div>
      <p class="text-xs font-medium text-slate-600">Authorising...</p>
    </div>

    <div id="workInProgressView" class="hidden text-center py-2">
      <div class="w-12 h-12 bg-indigo-50 border border-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-sm">
        <i data-lucide="hard-hat" class="w-6 h-6 text-indigo-600"></i>
      </div>
      <h2 class="text-base font-bold text-slate-900 mb-1">We're working on it!</h2>
      <p class="text-xs text-slate-500 mb-5 leading-relaxed">This feature isn't finished yet. Please check back later.</p>
      <div class="flex flex-col gap-2">
        <button onclick="showCloseOverlay()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-xs transition-colors flex items-center justify-center gap-1.5">
          <i data-lucide="x" class="w-4 h-4"></i>
          <span>Close Window</span>
        </button>
        <button onclick="resetView()" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition-colors">
          Back
        </button>
      </div>
    </div>

  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      const urlParams = new URLSearchParams(window.location.search);
      const serviceParam = urlParams.get('service');
      const emailParam = urlParams.get('email');

      if (serviceParam) {
        document.getElementById('serviceAppName').innerText = serviceParam;
        document.getElementById('loginTitle').innerText = 'Login to ' + serviceParam;
      }
      if (emailParam) {
        document.getElementById('userEmail').innerText = emailParam;
      }
    });

    function processAuthorization() {
      document.getElementById('oauthStepAuthorize').classList.add('hidden');
      document.getElementById('oauthStepLoading').classList.remove('hidden');

      setTimeout(() => {
        document.getElementById('oauthStepLoading').classList.add('hidden');
        document.getElementById('workInProgressView').classList.remove('hidden');
      }, 1000);
    }

    function resetView() {
      document.getElementById('workInProgressView').classList.add('hidden');
      document.getElementById('oauthStepAuthorize').classList.remove('hidden');
    }

    function showCloseOverlay() {
      document.getElementById('closeOverlay').classList.remove('hidden');
      document.getElementById('closeOverlay').classList.add('flex');
    }

    function hideCloseOverlay() {
      document.getElementById('closeOverlay').classList.add('hidden');
      document.getElementById('closeOverlay').classList.remove('flex');
    }
  </script>
</body>
</html>
