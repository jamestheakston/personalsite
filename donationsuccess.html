<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-stone-50 min-h-screen text-stone-800 flex flex-col justify-between antialiased">

  <main class="max-w-xl mx-auto px-6 py-20 sm:py-28 w-full flex-grow flex flex-col justify-center">
    
    <div class="mb-10">
      <div class="w-12 h-12 bg-emerald-100/80 text-emerald-700 rounded-full flex items-center justify-center mb-6">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      </div>
      <h1 class="text-3xl font-semibold text-stone-900 tracking-tight mb-3">Thank you for your support.</h1>
      <p class="text-stone-600 leading-relaxed">Thanks for donating to me. Your donation will help improve all services by me, not just the ones you use.</p>
    </div>

    <div class="bg-white rounded-2xl p-6 border border-stone-200/80 shadow-sm mb-10 space-y-6">
      <div class="flex items-start gap-4">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 mt-1.5 shrink-0"></div>
        <p class="text-sm text-stone-600 leading-relaxed">
          <strong class="font-medium text-stone-900">1% Carbon Pledge:</strong> 1% of your donation is allocated to removing CO₂ from our atmosphere.
        </p>
      </div>

      <hr class="border-stone-100">

      <div>
        <span class="block text-xs font-medium text-stone-400 uppercase tracking-wider mb-3">Spread the word</span>
        <div class="flex flex-wrap gap-2">
          <button onclick="share('twitter')" class="px-3.5 py-2 bg-stone-100 hover:bg-stone-200/70 text-stone-700 rounded-lg text-xs font-medium transition">
            X / Twitter
          </button>
          <button onclick="share('linkedin')" class="px-3.5 py-2 bg-stone-100 hover:bg-stone-200/70 text-stone-700 rounded-lg text-xs font-medium transition">
            LinkedIn
          </button>
          <button onclick="share('facebook')" class="px-3.5 py-2 bg-stone-100 hover:bg-stone-200/70 text-stone-700 rounded-lg text-xs font-medium transition">
            Facebook
          </button>
          <button onclick="copyLink()" class="px-3.5 py-2 bg-stone-100 hover:bg-stone-200/70 text-stone-700 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
            <span id="copy-label">Copy link</span>
          </button>
        </div>
      </div>
    </div>

  </main>

  <footer class="py-8 text-center text-xs text-stone-400">
    <p>© James Theakston <span id="current-year"></span></p>
  </footer>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-stone-900 text-stone-100 px-4 py-2.5 rounded-xl shadow-lg opacity-0 transition-opacity duration-200 pointer-events-none text-xs font-medium">
    Link copied to clipboard
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('current-year').innerText = new Date().getFullYear();
    });

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.remove('opacity-0');
      setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 2500);
    }

    function copyLink() {
      const currentUrl = window.location.href;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(currentUrl).then(onCopySuccess);
      } else {
        const dummy = document.createElement('input');
        document.body.appendChild(dummy);
        dummy.value = currentUrl;
        dummy.select();
        document.execCommand('copy');
        document.body.removeChild(dummy);
        onCopySuccess();
      }
    }

    function onCopySuccess() {
      const label = document.getElementById('copy-label');
      label.innerText = 'Copied!';
      showToast();
      setTimeout(() => {
        label.innerText = 'Copy link';
      }, 2500);
    }

    function share(platform) {
      const shareUrl = window.location.href;
      const shareText = "I just supported James Theakston's work!";

      if (platform === 'twitter') {
        window.open(`https://twitter.com/intent/tweet?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(shareText)}`, '_blank', 'noopener,noreferrer,width=600,height=400');
      } else if (platform === 'linkedin') {
        window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(shareUrl)}`, '_blank', 'noopener,noreferrer,width=600,height=500');
      } else if (platform === 'facebook') {
        window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}`, '_blank', 'noopener,noreferrer,width=600,height=400');
      }
    }
  </script>
</body>
</html>
