<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
    
    .checkmark-path {
      stroke-dasharray: 24;
      stroke-dashoffset: 24;
      animation: drawCheckmark 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards 0.1s;
    }

    @keyframes drawCheckmark {
      to {
        stroke-dashoffset: 0;
      }
    }
  </style>
</head>
<body class="bg-stone-50 min-h-screen text-stone-800 flex flex-col justify-between antialiased">

  <main class="max-w-xl mx-auto px-6 py-20 sm:py-28 w-full flex-grow flex flex-col justify-center">
    
    <div class="mb-10">
      <div class="w-12 h-12 bg-emerald-100/80 text-emerald-700 rounded-full flex items-center justify-center mb-6">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path class="checkmark-path" d="M20 6L9 17l-5-5"/>
        </svg>
      </div>
      <h1 class="text-3xl font-semibold text-stone-900 tracking-tight mb-3">Thank you for your support.</h1>
      <p class="text-stone-600 leading-relaxed">Thanks for donating to me. Your donation will help improve all services by me, not just the ones you use.</p>
    </div>

    <div class="bg-white rounded-2xl p-6 border border-stone-200/80 shadow-sm mb-10 space-y-6">
      <div class="flex items-start gap-3.5">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" class="w-6 h-6 mt-0.5 shrink-0">
          <defs>
            <linearGradient id="sc-card-a" gradientUnits="userSpaceOnUse" x1="16" y1="20.6293" x2="16" y2="7.8394" gradientTransform="matrix(1 0 0 -1 0 34)">
              <stop offset="0" stop-color="#00d924"/>
              <stop offset="1" stop-color="#00cb1b"/>
            </linearGradient>
            <linearGradient id="sc-card-b" gradientUnits="userSpaceOnUse" x1="24" y1="28.6289" x2="24" y2="17.2443" gradientTransform="matrix(1 0 0 -1 0 34)">
              <stop offset=".1562" stop-color="#009c00"/>
              <stop offset="1" stop-color="#00be20"/>
            </linearGradient>
            <linearGradient id="sc-card-c" gradientUnits="userSpaceOnUse" x1="8" y1="16.7494" x2="8" y2="29.1239" gradientTransform="matrix(1 0 0 -1 0 34)">
              <stop offset="0" stop-color="#ffe37d"/>
              <stop offset="1" stop-color="#ffc900"/>
            </linearGradient>
          </defs>
          <path d="M0 10.82h32c0 8.84-7.16 16-16 16s-16-7.16-16-16z" fill="url(#sc-card-a)"/>
          <path d="M32 10.82c0 2.21-1.49 4.65-5.41 4.65-3.42 0-7.27-2.37-10.59-4.65 3.52-2.43 7.39-5.63 10.59-5.63C29.86 5.18 32 8.17 32 10.82z" fill="url(#sc-card-b)"/>
          <path d="M0 10.82c0 2.21 1.49 4.65 5.41 4.65 3.42 0 7.27-2.37 10.59-4.65-3.52-2.43-7.39-5.64-10.59-5.64C2.14 5.18 0 8.17 0 10.82z" fill="url(#sc-card-c)"/>
        </svg>
        <p class="text-sm text-stone-600 leading-relaxed">
          1% of your donation is allocated to removing CO₂ from our atmosphere.
        </p>
      </div>

      <hr class="border-stone-100">

      <div>
        <span class="block text-xs font-medium text-stone-400 uppercase tracking-wider mb-3">Spread the word</span>
        <div class="flex items-center gap-2">
          <button onclick="share('twitter')" title="Share on X / Twitter" aria-label="Share on X / Twitter" class="w-10 h-10 bg-stone-100 hover:bg-stone-200/70 text-stone-700 rounded-lg flex items-center justify-center transition">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
              <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
          </button>
          <button onclick="share('linkedin')" title="Share on LinkedIn" aria-label="Share on LinkedIn" class="w-10 h-10 bg-stone-100 hover:bg-stone-200/70 text-stone-700 rounded-lg flex items-center justify-center transition">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
              <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
            </svg>
          </button>
          <button onclick="share('facebook')" title="Share on Facebook" aria-label="Share on Facebook" class="w-10 h-10 bg-stone-100 hover:bg-stone-200/70 text-stone-700 rounded-lg flex items-center justify-center transition">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
          </button>
          <button onclick="copyLink()" title="Copy link" aria-label="Copy link" class="w-10 h-10 bg-stone-100 hover:bg-stone-200/70 text-stone-700 rounded-lg flex items-center justify-center transition">
            <svg id="copy-icon" class="w-4 h-4 stroke-current fill-none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>

  </main>

  <footer class="py-8 text-center text-xs text-stone-400 space-y-2">
    <div class="flex items-center justify-center gap-1.5 text-stone-500 font-medium">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" class="w-4 h-4 shrink-0">
        <defs>
          <linearGradient id="sc-foot-a" gradientUnits="userSpaceOnUse" x1="16" y1="20.6293" x2="16" y2="7.8394" gradientTransform="matrix(1 0 0 -1 0 34)">
            <stop offset="0" stop-color="#00d924"/>
            <stop offset="1" stop-color="#00cb1b"/>
          </linearGradient>
          <linearGradient id="sc-foot-b" gradientUnits="userSpaceOnUse" x1="24" y1="28.6289" x2="24" y2="17.2443" gradientTransform="matrix(1 0 0 -1 0 34)">
            <stop offset=".1562" stop-color="#009c00"/>
            <stop offset="1" stop-color="#00be20"/>
          </linearGradient>
          <linearGradient id="sc-foot-c" gradientUnits="userSpaceOnUse" x1="8" y1="16.7494" x2="8" y2="29.1239" gradientTransform="matrix(1 0 0 -1 0 34)">
            <stop offset="0" stop-color="#ffe37d"/>
            <stop offset="1" stop-color="#ffc900"/>
          </linearGradient>
        </defs>
        <path d="M0 10.82h32c0 8.84-7.16 16-16 16s-16-7.16-16-16z" fill="url(#sc-foot-a)"/>
        <path d="M32 10.82c0 2.21-1.49 4.65-5.41 4.65-3.42 0-7.27-2.37-10.59-4.65 3.52-2.43 7.39-5.63 10.59-5.63C29.86 5.18 32 8.17 32 10.82z" fill="url(#sc-foot-b)"/>
        <path d="M0 10.82c0 2.21 1.49 4.65 5.41 4.65 3.42 0 7.27-2.37 10.59-4.65-3.52-2.43-7.39-5.64-10.59-5.64C2.14 5.18 0 8.17 0 10.82z" fill="url(#sc-foot-c)"/>
      </svg>
      <span>Stripe Climate Partner</span>
    </div>
    <p>© James Theakston <span id="current-year"></span></p>
  </footer>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-stone-900 text-stone-100 px-4 py-2.5 rounded-xl shadow-lg opacity-0 transition-opacity duration-200 pointer-events-none text-xs font-medium">
    Link copied to clipboard
  </div>

  <script>
    const DONATE_URL = "https://donate.stripe.com/00wcN5cKpfD77KmeJz00000";

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('current-year').innerText = new Date().getFullYear();
    });

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.remove('opacity-0');
      setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 2500);
    }

    function copyLink() {
      const dummy = document.createElement('textarea');
      document.body.appendChild(dummy);
      dummy.value = DONATE_URL;
      dummy.select();
      document.execCommand('copy');
      document.body.removeChild(dummy);
      showToast();
    }

    function share(platform) {
      const shareUrl = DONATE_URL;
      const shareText = "I just supported James Theakston's work!";

      if (platform === 'twitter') {
        window.open(`https://twitter.com/intent/tweet?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(shareText)}`, '_blank', 'noopener,noreferrer,width=600,height=400');
      } else if (platform === 'linkedin') {
        window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(shareUrl)}`, '_blank', 'noopener,noreferrer,width=600,height=500');
      } else if (platform === 'facebook') {
        window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}`, '_blank', 'noopener,noreferrer,width=600,height=400');
      }
    }
  </script>
</body>
</html>
